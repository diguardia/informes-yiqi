name: Meta · sincronizar informe comercial

# Actualiza data/meta.json con los datos de la Marketing API y data/pixel.json
# con los eventos del píxel. comercial.html los lee al cargar y con eso arma
# Resumen Meta, el gráfico mensual y la tabla de Anuncios. Si el JSON falta,
# el HTML cae en los valores embebidos y se ve igual que antes.
#
# El paso del píxel avisa por issue cuando aparece un Lead o un
# InitiateCheckout: GitHub le manda mail a quien siga el repositorio, así que
# no hace falta configurar SMTP ni sumar secretos nuevos.

on:
  schedule:
    # 09:00 UTC = 06:00 en Buenos Aires. El cron de GitHub siempre es UTC.
    # Para más frecuencia: '0 */6 * * *' (cada 6 horas).
    - cron: '0 9 * * *'
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions

concurrency:
  group: meta-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write             # necesario para el aviso del píxel

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Traer datos de Meta
        env:
          META_TOKEN:         ${{ secrets.META_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ vars.META_AD_ACCOUNT_ID || '370211010327709' }}
          META_API_VERSION:   ${{ vars.META_API_VERSION   || 'v25.0' }}
        run: node scripts/fetch-meta.mjs

      # Va después y con continue-on-error: si la consulta del píxel falla, la
      # sincronización del informe ya está hecha y no se pierde la corrida.
      - name: Traer eventos del píxel
        id: pixel
        continue-on-error: true
        env:
          META_TOKEN:       ${{ secrets.META_TOKEN }}
          META_PIXEL_ID:    ${{ vars.META_PIXEL_ID    || '455192279196875' }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v25.0' }}
        run: node scripts/fetch-pixel.mjs

      - name: Commitear si cambió
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Sin cambios en data/."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Meta: sincronizar datos del informe ($(date -u +%Y-%m-%d))"
          git push

      - name: Avisar si el píxel registró conversiones
        if: steps.pixel.outputs.avisar == 'si'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENTOS:  ${{ steps.pixel.outputs.eventos }}
          FECHA:    ${{ steps.pixel.outputs.fecha }}
          DETALLE:  ${{ steps.pixel.outputs.detalle }}
        run: |
          gh issue create \
            --title "Píxel: $EVENTOS el $FECHA" \
            --body "El píxel registró **$EVENTOS** el $FECHA (hora de Buenos Aires).

          Detalle del día: \`$DETALLE\`

          Serie completa en \`data/pixel.json\`. Recordá que los bots que hacen POST directo al endpoint no disparan el píxel, así que este conteo mide conversiones de personas con navegador — es más honesto que el conteo de ONs del CRM.

          _Generado por el workflow \`meta.yml\`._"
