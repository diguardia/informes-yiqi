    <style>
      /* La conclusion. Cierra la pagina y no lleva entrada en la nav: las
         cuatro secciones de la barra son las de datos, esto es el final del
         documento. Prosa, como el brief, y por la misma razon sin cifras
         tecleadas: las que aparecen las interpola el script desde RT. */
      #conclusion { --s2:8px; --s3:12px; --s5:20px; --s6:24px; --s7:28px; margin-top: var(--s7); }
      /* En las otras secciones el aire bajo el titulo lo pone .section-sub,
         que trae 18px. Esta no lleva bajada, asi que quedaba pegada a la
         card con los 3px de .section-title y nada mas. */
      #conclusion .section-head { margin-bottom: var(--s5); }
      #conclusion .cc-bloque { padding: var(--s5) var(--s6); }
      #conclusion .cc-tit { font: 600 15px var(--sans); color: var(--text); margin: 0 0 var(--s2); }
      #conclusion .cc-tit + p { margin-top: 0; }
      #conclusion p { font: 400 13px/1.7 var(--sans); color: var(--muted-2); max-width: 70ch; margin: 0 0 var(--s5); }
      #conclusion p:last-child { margin-bottom: 0; }
      #conclusion strong { color: var(--text); font-weight: 600; }
    </style>

    <section id="conclusion" aria-label="Conclusión del mes">
      <div class="section-head">
        <div>
          <span class="section-title">Conclusión</span>
        </div>
      </div>
      <div class="card cc-bloque card-reveal" id="cc-body"></div>
    </section>

    <script>
    (function () {
      const b = document.getElementById('cc-body');
      if (!b || typeof RT === 'undefined') return;
      const coma = n => String(n).replace('.', ',');
      const frecs = RT.campanas.filter(c => !c.esEl && c.frec != null).map(c => c.frec);
      const prom = frecs.length ? frecs.reduce((a, b) => a + b, 0) / frecs.length : 0;
      /* En palabras y redondeado: el numero exacto no cambia la conclusion y
         la cifra suelta invita a leerlo como si fuera lo que vio cada uno. */
      const LETRA = ['cero','una','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez'];
      const letra = n => LETRA[Math.round(n)] || coma(n.toFixed(1));
      b.innerHTML = `
        <p class="cc-tit">Un solo formato sostiene la cuenta.</p>
        <p>Todo lo que funciona son placas en Instagram. Las piezas en video no arrancaron y LinkedIn no salió: si las placas se desgastan, no hay con qué reemplazarlas.</p>
        <p class="cc-tit">El desgaste ya se vio.</p>
        <p>El retargeting corrió ${RT.dias} días con una sola pieza, y terminó mostrándose un promedio de ${letra(RT.frecuencia)} veces por persona alcanzada. En las campañas de captación, con público grande, el promedio es ${letra(prom)}. El problema no es la pauta: es no rotar piezas cuando el público es chico.</p>
        <p class="cc-tit">Le pautamos a desconocidos y facturamos por upselling.</p>
        <p>Toda la inversión del mes fue a gente que no nos conocía, y el dinero que entró lo pusieron clientes que ya trabajaban con nosotros — igual que la enorme mayoría de las ONs nuevas. <strong>El canal que factura no tiene una sola campaña propia.</strong></p>`;
      if (typeof initReveal === 'function') initReveal(b.parentElement || document);
      else b.classList.add('visible');
    })();
    </script>
